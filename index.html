      case 'delCourse': askConfirm(t('delConfirm', courseTitle(c)), () => { DB.courses = DB.courses.filter((k) => k.id !== c.id); if (!DB.courses.length) DB.courses.push(emptyCourse()); DB.active = DB.courses[0].id; assessTab = null; persistNow(); render(); }); break;
      case 'mclose': closeModal(); break;
      case 'addYearNo': case 'addProgNo': closeModal(); render(); break;
      case 'addProgOk': addProgramFromModal(); break;
      case 'addYearOk': { const inp = document.getElementById('ay_val'), y = parseInt(inp.value, 10); if (!(y > 1300 && y < 1700)) { toast(t('yearBad')); break; } const tg = inp.dataset.target, k = inp.dataset.key; if (DB.years.indexOf(y) < 0) DB.years.push(y); if (tg === 'cs') DB.coord.sel[k] = String(y); else c.course[k] = y; closeModal(); save(); render(); break; }
      case 'mok': { const cb = confirmCb; confirmCb = null; closeModal(); if (cb) cb(); break; }
      case 'addClo': if (c.clos.length < MAX_CLOS) { const id = uid('c'); c.clos.push({ id, code: nextCode(c), text: '' }); focusAfter = 'clo:' + id + ':text'; save(); render(); } break;
      case 'delClo': c.clos = c.clos.filter((k) => k.id !== el.dataset.id); c.assessments.forEach((a) => delete a.weights[el.dataset.id]); save(); render(); break;
      case 'addAsg': if (c.assessments.length < MAX_ASSESS) { const id = uid('a'); c.assessments.push({ id, name: '', max: 0, weights: {} }); assessTab = id; focusAfter = 'asg:' + id + ':name'; save(); render(); } break;
      case 'delAsg': { const a = c.assessments.find((x) => x.id === el.dataset.id); askConfirm(t('delConfirm', a && a.name || 'A'), () => { c.assessments = c.assessments.filter((x) => x.id !== a.id); delete c.marks[a.id]; save(); render(); }); break; }
      case 'addStud': { const id = uid('s'); ui.sq = ''; c.students.push({ id, sid: '', name: '', status: 'Current' }); focusAfter = 'st:' + id + ':sid'; save(); render(); const tw = document.querySelector('.tw.tall'); if (tw) tw.scrollTop = tw.scrollHeight; break; }
      case 'delStud': c.students = c.students.filter((s) => s.id !== el.dataset.id); Object.keys(c.marks).forEach((a) => delete c.marks[a][el.dataset.id]); save(); render(); break;
      case 'bulk': openModal('<h3>' + esc(t('bulkTitle')) + '</h3><p class="hint" style="margin:0">' + esc(t('bulkHelp')) + '</p><textarea class="ta" id="bulkTa" dir="auto" placeholder="4202331&#9;أمجد سليمان عمير الجهني"></textarea><div class="hint" id="bulkCnt"></div><div class="acts">' + btn('mclose', t('cancel'), '', '') + btn('bulkApply', t('bulkApply'), 'plus', 'pri') + '</div>'); break;
      case 'bulkApply': { const list = parseBulk(document.getElementById('bulkTa').value); closeModal(); if (list.length) { list.forEach((s) => c.students.push(s)); save(); render(); toast(t('bulkCount', list.length)); } break; }
      case 'tab': assessTab = el.dataset.id; render(); break;
      case 'fillMax': { const a = c.assessments.find((x) => x.id === assessTab); askConfirm(t('confirmFillA', a.name), () => { const cols = markCols(c, a); const m = (c.marks[a.id] = {}); c.students.forEach((s) => { m[s.id] = {}; cols.forEach((k) => { m[s.id][k.id] = a.weights[k.id]; }); }); save(); render(); }); break; }
      case 'clearA': { const a = c.assessments.find((x) => x.id === assessTab); askConfirm(t('confirmClearA', a.name), () => { c.marks[a.id] = {}; save(); render(); }); break; }
      case 'sort': { const k = el.dataset.key; ui.sort = { key: k, dir: ui.sort.key === k ? -ui.sort.dir : 1 }; render(); break; }
      case 'print': window.print(); break;
      case 'expXlsx': try { const wb = exportWorkbook(XLSX, c, compute(c)); const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' }); saveBlob(new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), fileBase(c) + '-CLO-Assessment.xlsx'); toast(t('exportedOk')); } catch (err) { toast(String(err)); } break;
      case 'expJson': saveBlob(new Blob([JSON.stringify({ app: 'clo-studio', v: 1, courses: DB.courses, coord: DB.coord, programs: DB.programs }, null, 1)], { type: 'application/json' }), 'CLO-Studio-backup.json'); toast(t('exportedOk')); break;
      case 'impXlsx': document.getElementById('fileX').click(); break;
      case 'impJson': document.getElementById('fileJ').click(); break;
      case 'sample': SEED.forEach((s) => { const n = clone(s); n.id = uid('k'); addCourseObj(n); }); save(); go('overview'); toast(t('dupDone')); break;
      case 'resetAll': askConfirm(t('resetConfirm'), () => { DB.courses = [emptyCourse()]; DB.active = DB.courses[0].id; save(); go('course'); }); break;
      case 'dfCopy': exportApp(); break;
      case 'dfLink': linkFile(false); break;
      case 'dfOpen': askConfirm(t('df.openConfirm'), () => linkFile(true)); break;
      case 'dfUnlink': unlinkFile(); break;
      case 'dfResume': resumeLink(); break;
      case 'homeEdit': homeEdit(); break;
      case 'homeSave': homeSave(); break;
      case 'homePhoto': document.getElementById('fileP').click(); break;
      case 'homePhotoDel': homeTmp.photo = ''; setPhotoPreview(); break;
      case 'homeOpen': DB.active = el.dataset.id; assessTab = null; save(); go('overview'); break;
      case 'tpPick': document.getElementById('fileT').click(); break;
      case 'tpDownload': saveBlob(b64ToBlob(TPL), tp.info.source === 'custom' ? tp.info.name : 'ETEC-Course-Report-Template.docx'); break;
      case 'tpRestore': askConfirm(t('tp.restoreConfirm'), restoreTemplate); break;
      case 'rpWord': reportWord(); break;
      case 'rpPrint': reportPrint(); break;
      case 'rpAdd': { const rpx = rpOf(el), l = el.dataset.l; const blank = { notCovered: { topic: '', reason: '', impact: '', action: '' }, improvements: { action: '', pct: '', comment: '' }, plan: { rec: '', action: '', support: '' } }[l]; rpx[l].push(Object.assign({}, blank)); focusAfter = 'rp:row:' + l + ':' + (rpx[l].length - 1) + ':' + Object.keys(blank)[0]; save(); render(); break; }
      case 'rpDel': rpOf(el)[el.dataset.l].splice(Number(el.dataset.i), 1); save(); render(); break;
      case 'rpSuggest': { const rpx = rpOf(el), sg = el.dataset.rs === 'coord' ? coordModel().suggest : REPORT.suggest(c, R), w = el.dataset.w; if (w === 'grade') rpx.gradeComment = sg.gradeComment; else if (w === 'overall') rpx.overall = sg.overall; else Object.keys(sg.cmt).forEach((id) => { if (!String(rpx.cmt[id] || '').trim()) rpx.cmt[id] = sg.cmt[id]; }); save(); render(); break; }
      case 'rpReset': askConfirm(t('rp.resetConfirm'), () => { if (el.dataset.rs === 'coord') DB.coord.reports[coordKey()] = REPORT.emptyReport(); else c.report = REPORT.emptyReport(); save(); render(); }); break;
      default: break;
    }
  });

  function askProgram(target) {
    openModal('<h3>' + esc(t('addProgTitle')) + '</h3><p class="hint" style="margin:0">' + esc(t('addProgHint')) + '</p>' +
      '<label class="field"><span>' + esc(t('progAr')) + '</span><input class="inp" id="ap_ar" dir="rtl" data-target="' + target + '"></label>' +
      '<label class="field"><span>' + esc(t('progEn')) + '</span><input class="inp" id="ap_en" dir="ltr"></label>' +
      '<label class="field"><span>' + esc(t('progCode')) + '</span><input class="inp" id="ap_code" dir="ltr"></label>' +
      '<div class="acts">' + btn('addProgNo', t('cancel'), '', '') + btn('addProgOk', t('create'), 'check', 'pri') + '</div>');
    const i = document.getElementById('ap_ar'); if (i) i.focus();
  }
  function addProgramFromModal() {
    const ar = document.getElementById('ap_ar').value.trim(), en = document.getElementById('ap_en').value.trim(), code = document.getElementById('ap_code').value.trim();
    if (!ar) { toast(t('progBad')); return; }
    const id = code || uid('p');
    if (PROGRAMS.some((x) => x[0] === id)) { toast(t('progDup')); return; }
    const p = { id, ar, en: en || ar }; DB.programs.push(p); regProgram(p);
    const tg = document.getElementById('ap_ar').dataset.target;
    if (tg === 'cs') DB.coord.sel.program = id; else cur().course.program = id;
    closeModal(); save(); render();
  }
  function ysPicker(pre, c, fromCourse) {
    const y = fromCourse ? c.course.year : (DB.nav.y || c.course.year || currentHijriYear()), sm = fromCourse ? c.course.semester : (DB.nav.s || c.course.semester || 1);
    return '<label class="field"><span>' + esc(t('year')) + '</span><select class="sel" id="' + pre + '_year">' + yearList(y).map((v) => '<option value="' + v + '"' + (String(v) === String(y) ? ' selected' : '') + '>' + esc(yearLabel(v)) + '</option>').join('') + '</select></label>' +
      '<label class="field"><span>' + esc(t('semester')) + '</span><select class="sel" id="' + pre + '_sem">' + [1, 2, 3].map((v) => '<option value="' + v + '"' + (String(v) === String(sm) ? ' selected' : '') + '>' + esc(semLabel(v)) + '</option>').join('') + '</select></label>';
  }
  function askYear(target, key) {
    openModal('<h3>' + esc(t('addYearTitle')) + '</h3><p class="hint" style="margin:0">' + esc(t('addYearHint')) + '</p><label class="field"><input class="inp" id="ay_val" type="number" min="1300" max="1700" step="1" placeholder="1449" data-target="' + target + '" data-key="' + key + '"></label><div class="acts">' + btn('addYearNo', t('cancel'), '', '') + btn('addYearOk', t('create'), 'check', 'pri') + '</div>');
  }
  function onField(el, commit) {
    const f = el.dataset.f; if (!f) return; const c = cur(); const v = el.value;
    switch (f) {
      case 'switch': DB.active = v; assessTab = null; save(); render(); return;
      case 'co': if (v === '__add') { askYear('co', el.dataset.k); return; } if (v === '__addProg') { askProgram('co'); return; } c.course[el.dataset.k] = (el.dataset.k === 'semester' || el.dataset.k === 'year') && v !== '' && !isNaN(Number(v)) ? Number(v) : v; if (commit) { save(); render(); return; } break;
      case 'tg': c.targets[el.dataset.d] = Number(v); if (commit) { save(); render(); } else { const sp = el.nextElementSibling; if (sp) sp.textContent = v + '%'; save(); } return;
      case 'clo': { const k = c.clos.find((x) => x.id === el.dataset.id); if (k) k[el.dataset.k] = v; if (commit) { save(); render(); return; } break; }
      case 'asg': { const a = c.assessments.find((x) => x.id === el.dataset.id); if (!a) break; if (el.dataset.k === 'max') { const n = parseNum(v); a.max = n == null || n === undefined ? 0 : n; save(); if (commit || String(n) === v.trim()) render(); return; } a[el.dataset.k] = v; if (commit) { save(); render(); return; } break; }
      case 'wt': { const a = c.assessments.find((x) => x.id === el.dataset.id); const n = parseNum(v); if (n == null) delete a.weights[el.dataset.k]; else if (n !== undefined) a.weights[el.dataset.k] = n; save(); if (commit || n == null || String(n) === v.trim()) render(); return; }
      case 'st': { const s = c.students.find((x) => x.id === el.dataset.id); if (!s) break; s[el.dataset.k] = v; if (commit || el.dataset.k === 'status') { save(); render(); return; } break; }
      case 'mk': { setMark(c, el.dataset.a, el.dataset.s, el.dataset.k, v); const a = c.assessments.find((x) => x.id === el.dataset.a); const n = parseNum(v); const bad = n != null && n !== undefined && (n > n0(a.weights[el.dataset.k]) + EPS || n < 0); el.classList.toggle('bad', !!bad); if (bad) el.title = t('exceeds', a.weights[el.dataset.k]); else el.removeAttribute('title'); refreshMarksLive(c, a, el.dataset.s); break; }
      case 'sq': ui.sq = v; if (commit) render(); else { clearTimeout(onField.t); onField.t = setTimeout(render, 220); } return;
      case 'rq': ui.q = v; clearTimeout(onField.t); onField.t = setTimeout(render, 220); return;
      case 'rgrade': ui.grade = v; render(); return;
      case 'rp': onReportField(el); return;
      case 'nv': { const k = el.dataset.k, N = DB.nav; N[k] = v; const yOf = (x) => String(x.course.year), sOf = (x) => String(x.course.semester); if (k === 'y' && N.s && !DB.courses.some((x) => (!N.y || yOf(x) === N.y) && sOf(x) === N.s)) N.s = ''; const list = DB.courses.filter((x) => (!N.y || yOf(x) === N.y) && (!N.s || sOf(x) === N.s)); if (list.length && !list.some((x) => x.id === DB.active)) { DB.active = list[0].id; assessTab = null; } persistNow(); render(); return; }
      case 'hf': DB.home[el.dataset.k] = v; save(); render(); return;
      case 'cs': if (v === '__add') { askYear('cs', el.dataset.k); return; } if (v === '__addProg') { askProgram('cs'); return; } DB.coord.sel[el.dataset.k] = v; save(); if (commit || el.tagName === 'SELECT') render(); return;
      case 'csx': { const i = DB.coord.excl.indexOf(el.dataset.id); if (el.checked && i >= 0) DB.coord.excl.splice(i, 1); else if (!el.checked && i < 0) DB.coord.excl.push(el.dataset.id); save(); render(); return; }
      case 'ref': { const n = parseNum(v); c.expected[el.dataset.k] = n == null || n === undefined ? 0 : n; save(); if (commit || String(n) === v.trim()) render(); return; }
      default: break;
    }
    save();
  }
  document.addEventListener('input', (e) => { if (e.target.id === 'bulkTa') { const n = parseBulk(e.target.value).length; document.getElementById('bulkCnt').textContent = n ? t('bulkCount', n) : ''; return; } if (e.target.dataset && e.target.dataset.f && e.target.tagName !== 'SELECT' && !e.isComposing) onField(e.target, false); });
  document.addEventListener('change', (e) => { if (e.target.dataset && e.target.dataset.f) onField(e.target, true); });
  document.addEventListener('compositionend', (e) => { if (e.target.dataset && e.target.dataset.f) onField(e.target, false); });

  document.addEventListener('keydown', (e) => {
    const el = e.target; if (!el.dataset || el.dataset.f !== 'mk') return;
    const dy = e.key === 'Enter' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowUp' ? -1 : 0; if (!dy) return;
    e.preventDefault(); const nxt = document.querySelector('input[data-f="mk"][data-ri="' + (Number(el.dataset.ri) + dy) + '"][data-ci="' + el.dataset.ci + '"]'); if (nxt) { nxt.focus(); nxt.select(); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.target.id === 'ay_val' || /^ap_/.test(e.target.id))) { e.preventDefault(); const b = modalHost.querySelector('[data-act="' + (e.target.id === 'ay_val' ? 'addYearOk' : 'addProgOk') + '"]'); if (b) b.click(); } });
  document.addEventListener('focusin', (e) => { if (e.target.dataset && (e.target.dataset.f === 'mk') && e.target.select) e.target.select(); });
  document.addEventListener('paste', (e) => {
    const el = e.target; if (!el.dataset || el.dataset.f !== 'mk') return;
    const text = (e.clipboardData || window.clipboardData).getData('text'); if (!/[\t\n]/.test(text.trim())) return;
    e.preventDefault(); const c = cur(); const a = c.assessments.find((x) => x.id === el.dataset.a); const cols = markCols(c, a);
    const mat = text.replace(/\r/g, '').split('\n').filter((l, i, ar) => !(i === ar.length - 1 && l === '')).map((l) => l.split('\t'));
    let n = 0; const r0 = Number(el.dataset.ri), c0 = Number(el.dataset.ci);
    mat.forEach((row, i) => row.forEach((val, j) => { const s = c.students[r0 + i], k = cols[c0 + j]; if (s && k) { setMark(c, a.id, s.id, k.id, val); n++; } }));
    save(); render(); toast(t('pasted', n));
  });

  /* tooltips for chart marks */
  const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; document.body.appendChild(tip);
  document.addEventListener('mousemove', (e) => { const el = e.target.closest && e.target.closest('[data-tip]'); if (!el) { tip.hidden = true; return; } tip.textContent = el.dataset.tip; tip.hidden = false; tip.style.left = Math.min(window.innerWidth - tip.offsetWidth - 8, e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; });

  /* file inputs */
  document.getElementById('fileX').addEventListener('change', (e) => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { const wb = XLSX.read(new Uint8Array(rd.result), { type: 'array' }); const n = importWorkbook(XLSX, wb); addCourseObj(n); save(); go('overview'); toast(t('importedOk')); } catch (err) { toast(t('importedFail')); } };
    rd.readAsArrayBuffer(f);
  });
  document.getElementById('fileJ').addEventListener('change', (e) => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { const o = JSON.parse(rd.result); if (!o || !Array.isArray(o.courses)) throw new Error('bad'); if (o.coord && o.coord.reports) Object.assign(DB.coord.reports, o.coord.reports); if (Array.isArray(o.programs)) o.programs.forEach((p) => { if (p && p.id && p.ar && !PROGRAMS.some((x) => x[0] === p.id)) { DB.programs.push(p); regProgram(p); } }); o.courses.forEach((k) => { k.id = uid('k'); addCourseObj(k); }); save(); go('overview'); toast(t('importedOk')); } catch (err) { toast(t('jsonBad')); } };
    rd.readAsText(f);
  });
  document.getElementById('fileP').addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; photoFromFile(f); });
  document.getElementById('fileT').addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; adoptFile(f); });
  ['dragenter', 'dragover'].forEach((ev) => document.addEventListener(ev, (e) => { const z = e.target.closest && e.target.closest('[data-drop="tpl"]'); if (!z) return; e.preventDefault(); z.classList.add('on'); }));
  document.addEventListener('dragleave', (e) => { const z = e.target.closest && e.target.closest('[data-drop="tpl"]'); if (z) z.classList.remove('on'); });
  document.addEventListener('drop', (e) => { const z = e.target.closest && e.target.closest('[data-drop="tpl"]'); if (!z) return; e.preventDefault(); z.classList.remove('on'); adoptFile(e.dataTransfer.files[0]); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.act === 'homeOpen') { e.preventDefault(); e.target.click(); } });
  document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.drop === 'tpl') { e.preventDefault(); document.getElementById('fileT').click(); } });
  window.addEventListener('hashchange', () => { const p = location.hash.slice(1); if (PAGES.some((x) => x[0] === p) && p !== page) { page = p; render(); } });

  /* ---------- boot ---------- */
  loadDB();
  const h0 = location.hash.slice(1); if (PAGES.some((x) => x[0] === h0)) page = h0;
  TPL = window.__TPL || '';
  render();
  recoverData().catch((e) => console.error(e));
  loadTemplateBoot().then(() => { if (page === 'report' || page === 'coord' || page === 'template') render(); }).catch((e) => console.error(e));
  window.__clo = { persistNow, fl, tplState: tp, adoptFile, restoreTemplate, get TPL() { return TPL; }, tplReady: () => tp.check, coordModel, get db() { return DB; }, get R() { return R; }, go, render, reportModel, reportPrint, reportWord };
})();
</script>
